name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          msg=$(sed -n '/What went wrong/,$p' build.log | head -n 40)
          [ -z "$msg" ] && msg=$(tail -n 40 build.log)
          msg=$(printf '%s' "$msg" | tr '\n' '|' | cut -c1-6000)
          echo "::error::$msg"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: delta-melee-fabric
          path: build/libs/*.jar
          if-no-files-found: error
